<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe600">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Minha Loja ML</title>
<style>
:root{--y:#ffe600;--b:#2d3277;--bg:#ebebeb;--c:#fff;--t:#333;--m:#666;--g:#00a650;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--c:#1e1e1e;--t:#eee;--m:#aaa;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px}
header{background:var(--y);color:#333;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
main{padding:16px;max-width:640px;margin:auto}
.card{background:var(--c);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0002}
.seller{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.m{color:var(--m);font-size:13px}
.price{font-size:22px;font-weight:600}
.badge{display:inline-block;background:var(--g);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.badge.off{background:#999}
button,.btn{font:inherit;border:0;border-radius:6px;padding:12px 14px;background:#3483fa;color:#fff;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}
button.s,.btn.s{background:#e3edfb;color:#3483fa}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1;text-align:center;min-width:120px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--c);color:var(--t)}
textarea{min-height:90px}
.img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#ccc;margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 2px 8px #0005;border-radius:28px;padding:14px 20px}
dialog{border:0;border-radius:10px;width:min(560px,94vw);max-height:92vh;padding:16px;background:var(--c);color:var(--t)}
dialog::backdrop{background:#0007}
.warn{background:#fff3cd;color:#664d03;border-radius:6px;padding:10px;font-size:13px}
</style>
</head>
<body>
<header><h1>Minha Loja ML</h1><button class="s" id="btnPerfil">Perfil</button></header>
<main>
  <div class="card seller">
    <div class="av" id="av">L</div>
    <div><b id="nome"></b><div class="m" id="email"></div><div class="m" id="resumo"></div></div>
  </div>
  <div class="warn" id="aviso" hidden></div>
  <h2 style="font-size:16px">Meus produtos</h2>
  <div id="lista"></div>
</main>
<button class="fab" id="btnNovo">+ Novo produto</button>

<dialog id="dlgP"><form method="dialog" id="fP">
  <h3 style="margin-top:0">Produto</h3>
  <label>Título do anúncio</label><input id="pTitulo" required maxlength="60">
  <label>Marca / Modelo</label><input id="pMarca">
  <label>Preço (R$)</label><input id="pPreco" type="number" step="0.01" min="0" inputmode="decimal" required>
  <label>Estoque</label><input id="pEst" type="number" min="1" value="1" inputmode="numeric">
  <label>Condição</label><select id="pCond"><option>Novo</option><option>Usado</option></select>
  <label>Link do produto no Mercado Livre (onde você comprou)</label><input id="pLink" type="url" placeholder="https://produto.mercadolivre.com.br/...">
  <label>URL da foto</label><input id="pFoto" type="url">
  <label>Descrição</label><textarea id="pDesc"></textarea>
  <div class="row"><button type="button" class="s" id="pCancel">Cancelar</button><button type="submit">Salvar</button></div>
</form></dialog>

<dialog id="dlgU"><form method="dialog" id="fU">
  <h3 style="margin-top:0">Perfil do vendedor</h3>
  <label>Nome</label><input id="uNome" required>
  <label>E-mail da conta Mercado Livre</label><input id="uEmail" type="email" required>
  <div class="row"><button type="button" class="s" id="uCancel">Cancelar</button><button type="submit">Salvar</button></div>
</form></dialog>

<script>
const K='lojaml.v1';
const $=id=>document.getElementById(id);
const brl=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({
  user:{nome:'Luan Trindade Soares',email:'luatessoares@gmail.com'},
  items:[{id:1,titulo:'Projetor',marca:'',preco:0,est:1,cond:'Novo',link:'',foto:'',desc:'Projetor adquirido pelo Mercado Livre. Edite com marca, modelo, resolução (lumens) e preço antes de anunciar.',status:'rascunho'}]
});
function load(){try{return JSON.parse(localStorage.getItem(K))||seed()}catch{return seed()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch{}}
let S=load(),editId=null;

function render(){
  $('nome').textContent=S.user.nome;$('email').textContent=S.user.email;
  $('av').textContent=(S.user.nome[0]||'L').toUpperCase();
  const at=S.items.filter(i=>i.status==='anunciado').length;
  $('resumo').textContent=`${S.items.length} produto(s) · ${at} anunciado(s)`;
  const av=$('aviso');
  av.hidden=S.items.every(i=>i.preco>0);
  av.textContent='Preencha marca, modelo e preço do projetor para poder anunciar.';
  $('lista').innerHTML=S.items.map(i=>`
    <div class="card">
      ${i.foto?`<img class="img" src="${esc(i.foto)}" alt="" onerror="this.remove()">`:''}
      <span class="badge ${i.status==='anunciado'?'':'off'}">${i.status==='anunciado'?'Anunciado':'Rascunho'}</span>
      <h3 style="margin:6px 0">${esc(i.titulo)}</h3>
      <div class="m">${esc(i.marca)} · ${esc(i.cond)} · estoque ${i.est}</div>
      <div class="price">${i.preco>0?brl(i.preco):'Defina o preço'}</div>
      <p class="m">${esc(i.desc)}</p>
      <div class="row">
        <button class="s" onclick="edit(${i.id})">Editar</button>
        <button class="s" onclick="copiar(${i.id})">Copiar anúncio</button>
        <a class="btn" href="https://www.mercadolivre.com.br/vender" target="_blank" rel="noopener" onclick="marcar(${i.id})">Anunciar no ML</a>
        <button class="s" onclick="del(${i.id})">Excluir</button>
      </div>
    </div>`).join('')||'<div class="card m">Nenhum produto ainda.</div>';
}
function edit(id){
  editId=id;const i=S.items.find(x=>x.id===id)||{titulo:'',marca:'',preco:'',est:1,cond:'Novo',link:'',foto:'',desc:''};
  $('pTitulo').value=i.titulo;$('pMarca').value=i.marca;$('pPreco').value=i.preco||'';$('pEst').value=i.est;
  $('pCond').value=i.cond;$('pLink').value=i.link;$('pFoto').value=i.foto;$('pDesc').value=i.desc;
  $('dlgP').showModal();
}
$('btnNovo').onclick=()=>edit(null);
$('pCancel').onclick=()=>$('dlgP').close();
$('fP').onsubmit=()=>{
  const d={titulo:$('pTitulo').value.trim(),marca:$('pMarca').value.trim(),preco:parseFloat($('pPreco').value)||0,est:parseInt($('pEst').value)||1,cond:$('pCond').value,link:$('pLink').value.trim(),foto:$('pFoto').value.trim(),desc:$('pDesc').value.trim()};
  if(editId){Object.assign(S.items.find(x=>x.id===editId),d)}else{S.items.push({id:Date.now(),status:'rascunho',...d})}
  save();render();
};
function del(id){if(confirm('Excluir este produto?')){S.items=S.items.filter(x=>x.id!==id);save();render()}}
function marcar(id){S.items.find(x=>x.id===id).status='anunciado';save();setTimeout(render,300)}
function copiar(id){
  const i=S.items.find(x=>x.id===id);
  const t=`${i.titulo}${i.marca?' - '+i.marca:''}\nCondição: ${i.cond}\nPreço: ${brl(i.preco)}\nEstoque: ${i.est}\n\n${i.desc}`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Texto copiado. Cole no formulário do Mercado Livre.')).catch(()=>prompt('Copie o texto:',t));
}
$('btnPerfil').onclick=()=>{$('uNome').value=S.user.nome;$('uEmail').value=S.user.email;$('dlgU').showModal()};
$('uCancel').onclick=()=>$('dlgU').close();
$('fU').onsubmit=()=>{S.user={nome:$('uNome').value.trim(),email:$('uEmail').value.trim()};save();render()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
